name: Go CI

on:
  workflow_call:
    inputs:
      go-version:
        description: "Versao do Go utilizada pelo microsservico"
        required: false
        type: string
        default: "1.21"

jobs:
  build-test:
    name: Build and Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build application
        run: go build ./...

      - name: Run unit tests
        run: go test ./...

  lint:
    name: Linter
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest