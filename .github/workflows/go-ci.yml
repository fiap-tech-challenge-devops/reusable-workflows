name: Go CI

on:
  workflow_call:
    inputs:
      go-version:
        description: "Versao do Go utilizada pelo microsservico"
        required: false
        type: string
        default: "1.21"

      ecr-repository:
        description: "Nome do repositorio ECR"
        required: true
        type: string

      aws-region:
        description: "Regiao da AWS onde o registry ECR vive"
        required: false
        type: string
        default: "us-east-1"

    secrets:
      AWS_ROLE_ARN:
        description: "ARN da role assumida por federacao OIDC para publicar no ECR. Nao e uma credencial."
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  build-test:
    name: Build and Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build application
        run: go build ./...

      - name: Run unit tests
        run: go test ./...

  lint:
    name: Linter
    runs-on: ubuntu-latest
    needs: build-test
    continue-on-error: true

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  Security:
    name: Security Scan (Secrets, SAST & SCA)
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Install Gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run Gitleaks
        run: gitleaks dir . --redact --verbose --exit-code 1

      - name: Run Gosec Security Scanner
        continue-on-error: true
        uses: securego/gosec@v2.29.0
        with:
          args: -severity high ./...

      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

  image:
    name: Build, Scan and Push Image
    runs-on: ubuntu-latest
    needs:
      - build-test
      - Security
  
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
     
      - name: Resolve image URI
        id: img
        run: echo "uri=${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.img.outputs.uri }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.uri }}
          format: table
          exit-code: "1"
          severity: CRITICAL

      # Em PR o github.sha e o merge efemero, que nao existe no historico — a
      # imagem publicada ali nao seria rastreavel nem iria para o cluster.
      - name: Push to Amazon ECR
        if: github.event_name == 'push'
        run: docker push ${{ steps.img.outputs.uri }}
