name: Go CI

on:
  workflow_call:
    inputs:
      go-version:
        description: "Versao do Go utilizada pelo microsservico"
        required: false
        type: string
        default: "1.21"

      ecr-repository:
        description: "Nome do repositorio ECR"
        required: true
        type: string

      aws-region:
        description: "Regiao da AWS onde o registry ECR vive"
        required: false
        type: string
        default: "us-east-1"

    secrets:
      AWS_ROLE_ARN:
        description: "ARN da role assumida por federacao OIDC para publicar no ECR. Nao e uma credencial."
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  build-test:
    name: Build and Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build application
        run: go build ./...

      - name: Run unit tests
        run: go test ./...

  lint:
    name: Linter
    runs-on: ubuntu-latest
    needs: build-test
    continue-on-error: true

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  Security:
      name: Security Scan (SAST & SCA)
      runs-on: ubuntu-latest
      needs: build-test

      steps:
        - name: Checkout source code
          uses: actions/checkout@v7

       
        - name: Run Gosec Security Scanner
          continue-on-error: true
          uses: securego/gosec@v2.29.0
          with:
            args: -severity high ./...

        - name: Run Trivy vulnerability scanner in fs mode
          uses: aquasecurity/trivy-action@v0.36.0
          with:
            scan-type: 'fs'
            scan-ref: '.'
            format: 'table'
            exit-code: '1' 
            severity: 'CRITICAL'

  docker:
    name: Docker Build and Container Scan
    runs-on: ubuntu-latest
    needs:
      - build-test
      - Security

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ inputs.ecr-repository }}:${{ github.sha }}

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.ecr-repository }}:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL

  ecr-push:
    name: Push Image to Amazon ECR
    runs-on: ubuntu-latest
    needs:
      - docker

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}:${{ github.sha }}

  