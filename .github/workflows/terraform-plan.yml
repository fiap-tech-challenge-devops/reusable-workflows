name: Terraform — Plan

# Esteira de plano para repositórios de IaC. Doc e exemplo: docs/terraform-plan/
# O plano é descartado ao fim do run: nunca vira artifact.

on:
  workflow_call:
    inputs:
      stages:
        description: >-
          JSON com os stages a planejar. Cada entrada precisa de "stage" (o
          diretório) e "required" (se a falha do plano reprova o job).
          Ex.: '[{"stage":"infra","required":true},{"stage":"addons","required":false}]'
        type: string
        required: true
      summary-stage:
        description: "Qual stage recebe o resumo por IA. Vazio desliga o resumo."
        type: string
        required: false
        default: "infra"
      state-bucket-prefix:
        description: "Bucket do state, resolvido como <prefix>-<ACCOUNT_ID>."
        type: string
        required: true
      aws-region:
        description: "Região onde o state e os recursos vivem."
        type: string
        required: false
        default: "us-east-1"
      terraform-version:
        description: "Versão do Terraform instalada nos jobs."
        type: string
        required: false
        default: "1.15.8"
      openai-model:
        description: "Modelo usado no resumo por IA."
        type: string
        required: false
        default: "gpt-5.6-terra"
      trivy-config:
        description: "Caminho do arquivo de configuração do Trivy, relativo à raiz do repositório."
        type: string
        required: false
        default: "trivy.yaml"
      checkov-config:
        description: "Caminho do arquivo de configuração do Checkov, relativo à raiz do repositório."
        type: string
        required: false
        default: ".checkov.yaml"

    secrets:
      aws-oidc-role-arn:
        description: "Role assumida por federação OIDC."
        required: true
      openai-api-key:
        description: "Chave da OpenAI. Ausente, o resumo simplesmente não aparece."
        required: false

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_IN_AUTOMATION: "true"

jobs:
  validate:
    name: Validate (${{ matrix.stage }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.stages) }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform-version }}

      - name: Terraform fmt
        working-directory: ${{ matrix.stage }}
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: ${{ matrix.stage }}
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: ${{ matrix.stage }}
        run: terraform validate

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
 
      - name: Trivy (IaC misconfiguration)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          trivy-config: ${{ inputs.trivy-config }}
          exit-code: "1"

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12.3115.0
        with:
          directory: .
          config_file: ${{ inputs.checkov-config }}
          soft_fail: false

  plan:
    name: Plan (${{ matrix.stage }})
    runs-on: ubuntu-latest
    needs: [validate, security]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.stages) }}
    steps:
      - uses: actions/checkout@v7

      - name: Autenticar na AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.aws-oidc-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform-version }}

      - name: Backend config
        id: backend
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "bucket=${{ inputs.state-bucket-prefix }}-${ACCOUNT_ID}" >> "$GITHUB_OUTPUT"

      - name: Terraform init
        working-directory: ${{ matrix.stage }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ steps.backend.outputs.bucket }}" \
            -backend-config="region=${{ inputs.aws-region }}" \
            -backend-config="use_lockfile=true"

      - name: Terraform plan
        id: plan
        working-directory: ${{ matrix.stage }}
        continue-on-error: ${{ !matrix.required }}
        run: |
          terraform plan -input=false -lock=false -no-color -out=tfplan 2>&1 | tee plan.txt
          exit "${PIPESTATUS[0]}"
   
      - name: Resumo do plano por IA
        id: resumo_ia
        if: inputs.summary-stage != '' && matrix.stage == inputs.summary-stage && steps.plan.outcome == 'success'
        continue-on-error: true
        uses: fiap-tech-challenge-devops/reusable-workflows/actions/terraform-plan-summary@v1.0.0
        with:
          api-key: ${{ secrets.openai-api-key }}
          working-directory: ${{ matrix.stage }}
          model: ${{ inputs.openai-model }}
          label: ${{ matrix.stage }}

      - name: Resumo do plano
        if: always()
        env:
          OUTCOME: ${{ steps.plan.outcome }}
          REQUIRED: ${{ matrix.required }}
          STAGE: ${{ matrix.stage }}
        run: |
          # Falha em stage não obrigatório costuma ser dependência não aplicada.
          case "$OUTCOME:$REQUIRED" in
            success:*)     ICON="✅"; NOTA="" ;;
            failure:false) ICON="⚠️"; NOTA="> Falha esperada enquanto as dependências deste stage não tiverem sido aplicadas. Não bloqueia o merge." ;;
            *)             ICON="❌"; NOTA="" ;;
          esac

          {
            echo "### $ICON Terraform plan — \`$STAGE\` ($OUTCOME)"
            echo ""
            if [ -n "$NOTA" ]; then
              echo "$NOTA"
              echo ""
            fi
            # Acima do plano, não no lugar dele. Vem pronto do action.
            if [ -s "$STAGE/resumo-ia.md" ]; then
              cat "$STAGE/resumo-ia.md"
              echo ""
            fi
            echo '<details><summary>Ver plano</summary>'
            echo ""
            echo '```terraform'
            # tail: o resumo fica no fim, e o summary tem limite de 1 MB.
            tail -c 900000 "$STAGE/plan.txt" 2>/dev/null || echo "sem saída de plan"
            echo '```'
            echo ""
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comentar no PR
        uses: actions/github-script@v9
        if: always() && github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const stage = '${{ matrix.stage }}';
            const outcome = '${{ steps.plan.outcome }}';

            let plan = '';
            try {
              plan = fs.readFileSync(stage + '/plan.txt', 'utf8');
            } catch (e) {
              plan = 'Nenhuma saída de plan — o step não chegou a executar.';
            }

            // Pode faltar: secret ausente, API fora, resposta sem texto.
            let resumo = '';
            try {
              resumo = fs.readFileSync(stage + '/resumo-ia.md', 'utf8').trim();
            } catch (e) { /* sem resumo — segue com o plano puro */ }

            // Limite de 65536 caracteres no corpo do comentário.
            const LIMIT = 60000;
            if (plan.length > LIMIT) {
              plan = '...(truncado)...\n' + plan.slice(-LIMIT);
            }

            const icon = outcome === 'success' ? '✅'
                       : (outcome === 'failure' && '${{ matrix.required }}' === 'false') ? '⚠️'
                       : '❌';

            const note = (outcome === 'failure' && '${{ matrix.required }}' === 'false')
              ? '\n> Falha esperada enquanto as dependências deste stage não tiverem sido aplicadas.\n'
              : '';

            const body = [
              '### ' + icon + ' Terraform plan — `' + stage + '`',
              note,
              resumo,
              '<details><summary>Ver plano</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>',
            ].join('\n');

            // Atualiza o comentário anterior em vez de empilhar um novo.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const previous = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Terraform plan — `' + stage + '`')
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
