name: Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: "Versao do Python utilizada pelo microsservico"
        required: false
        type: string
        default: "3.9"

      ecr-repository:
        description: "Nome do repositorio ECR"
        required: true
        type: string

      aws-region:
        description: "Regiao da AWS onde o registry ECR vive"
        required: false
        type: string
        default: "us-east-1"

    secrets:
      AWS_ROLE_ARN:
        description: "ARN da role assumida por federacao OIDC para publicar no ECR. Nao e uma credencial."
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  build-test:
    name: Build and Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo fonte
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar sintaxe Python
        run: python -m compileall .

      - name: Verificar existencia de testes
        id: tests
        shell: bash
        run: |
          if find . -type f \( -name "test_*.py" -o -name "*_test.py" \) | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Nenhum teste unitario encontrado."
          fi

      - name: Executar testes unitarios
        if: steps.tests.outputs.found == 'true'
        run: |
          pip install pytest
          pytest -v

  lint:
    name: Linter
    runs-on: ubuntu-latest
    needs: build-test
    continue-on-error: true

    steps:
      - name: Checkout do codigo fonte
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: Instalar Ruff
        run: pip install ruff

      - name: Executar Ruff
        run: ruff check .

  security:
    name: Security Scan (SAST & SCA)
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout do codigo fonte
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: Instalar Gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Executar Gitleaks
        run: gitleaks dir . --redact --verbose --exit-code 1

      - name: Instalar Bandit
        run: pip install bandit

      - name: Executar Bandit SAST
        continue-on-error: true
        run: bandit -r . -ll

      - name: Executar Trivy SCA
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "1"
          severity: CRITICAL

  image:
    name: Build, Scan and Push Image
    runs-on: ubuntu-latest
    needs:
      - build-test
      - security

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image URI
        id: img
        run: echo "uri=${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr-repository }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.img.outputs.uri }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.uri }}
          format: table
          exit-code: "1"
          severity: CRITICAL

      # Em PR o github.sha e o merge efemero, que nao existe no historico — a
      # imagem publicada ali nao seria rastreavel nem iria para o cluster.
      - name: Push to Amazon ECR
        if: github.event_name == 'push'
        run: docker push ${{ steps.img.outputs.uri }}
